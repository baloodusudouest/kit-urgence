# Service à ajouter dans une stack Docker Compose (ex. Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example).
services:
  kit-urgence:
    image: ghcr.io/baloodusudouest/kit-urgence:latest   # ou une version précise (2.1.1) pour revenir en arrière
    container_name: kit-urgence
    restart: unless-stopped
    ports:
      - "8095:8095"                       # interface, et API lue par Home Assistant
    environment:
      - TZ=Europe/Paris
      # Variables communes de la maison (module app/maison.py) ; depuis la 2.5, plus aucun ancien nom n'est lu
      - MAISON_PASSWORD=${MAISON_PASSWORD}         # mot de passe commun des applis : obligatoire (12 caractères au moins)
      - MAISON_JETON=${MAISON_JETON:-}             # jeton commun : accepté en plus d'API_TOKEN (pour carnet),
                                                   # seul à ouvrir /externe/sauvegarde (l'Anneau) et à interroger l'Anneau
      - ANNEAU_CLE=${ANNEAU_CLE:-}                 # contrat 3 : l'Anneau lit les fiches « Connexion » ; vide = porte fermée
      - MAISON_LECTURE_SEULE=${MAISON_LECTURE_SEULE:-}   # « oui » : aucune appli n'écrit ; KIT_LECTURE_SEULE l'emporte si posée
      - PAPIERS_PASSWORD=${KIT_PAPIERS_PASSWORD}   # mot de passe du livre des papiers (secret)
      - API_TOKEN=${KIT_API_TOKEN}                 # jeton de Home Assistant : obligatoire
                                                   # (sans lui, adresses à jeton fermées même avec MAISON_JETON)
      - KIT_LECTURE_SEULE=${KIT_LECTURE_SEULE:-}   # « 1 »/« oui » ou « non » : force le kit seul (l'emporte sur la maison)
      # Réglages d'usage (nom du foyer, liseuse, intervalle de recherche) : pas de variable, ils se règlent
      # dans l'écran Réglages du kit (fichier config/config.yaml) et l'Anneau les sauvegarde chaque nuit.
      # Le lien « Ouvrir dans carnet » prend l'adresse de la tuile « carnet » de l'Anneau.
      - LOG_LEVEL=INFO
    volumes:
      # Sources et kit généré : éditables depuis le réseau local
      - ${KIT_DATA_DIR}:/data
      # Clé SSH, empreintes, statut : hors de tout partage réseau
      - ${KIT_STATE_DIR}:/state
    labels:
      # Le kit écrit sur la liseuse : mises à jour à la main, en changeant KIT_VERSION
      - com.centurylinklabs.watchtower.enable=false
