# Tests (jeu inventé, fausse liseuse), puis image ghcr.io/<propriétaire>/kit-urgence:<version>.
# Depuis la 2.0.0 l'étiquette « latest » n'est plus publiée : le NAS choisit sa version (KIT_VERSION),
# Watchtower ne met plus le kit à jour tout seul.
name: Image Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils du générateur (pandoc, qpdf, pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
          curl -fsSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests --ignore=tests/interface
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Interface compilée
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx vite build
      - name: Tests d'écran (PC et iPhone, fausse liseuse)
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium || python -m playwright install chromium
          python -m pytest -q tests/interface

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kit-urgence:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kit-urgence:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrage de l'image
        run: |
          image=ghcr.io/${{ github.repository_owner }}/kit-urgence:sha-${{ github.sha }}
          # Sans mot de passe, le conteneur doit refuser de démarrer
          if docker run --rm -e API_TOKEN=x "$image" >/dev/null 2>&1; then echo "a démarré sans mot de passe"; exit 1; fi
          docker run -d --name essai -e KIT_PASSWORD=essai-essai -e API_TOKEN=x -e PAPIERS_PASSWORD=x -p 8095:8095 "$image"
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8095/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8095/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8095/api/etat)" = 401
          curl -fs http://127.0.0.1:8095/ | grep -q "Kit d'urgence"
          docker logs essai | tail -5
