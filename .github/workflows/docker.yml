# Construit l'image, lance TOUS les tests dedans (jeu inventé, fausse liseuse, écrans PC et iPhone),
# puis publie ghcr.io/<propriétaire>/kit-urgence:<version>.
# Les tests tournent dans l'image et non sur la machine de GitHub : c'est l'image qui part sur le NAS,
# avec son pandoc et son qpdf à elle (qpdf 12, celui d'Ubuntu 26.04, refuse l'appel de chiffrement du kit).
# Étiquettes : « latest » (2.1.1 : de nouveau publiée, la stack du NAS suit « latest »), la version et le commit.
# Watchtower reste coupé pour ce service : « latest » n'arrive sur le NAS que quand la stack est redéployée.
name: Image Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kit-urgence:essai
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tests dans l'image (générateur, API, écrans)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests":/app/tests -w /app kit-urgence:essai -c "
            pip install -q --root-user-action=ignore pytest==8.4.2 httpx==0.28.1 playwright==1.63.0 &&
            python -m playwright install --with-deps chromium >/dev/null &&
            python -m pytest -q tests"
      - name: Démarrage de l'image
        run: |
          # Sans mot de passe, le conteneur doit refuser de démarrer
          if timeout 30 docker run --rm -e API_TOKEN=x kit-urgence:essai >/dev/null 2>&1; then echo "a démarré sans mot de passe"; exit 1; fi
          docker run -d --name essai -e KIT_PASSWORD=essai-essai -e API_TOKEN=x -e PAPIERS_PASSWORD=x -p 8095:8095 kit-urgence:essai
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8095/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8095/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8095/api/etat)" = 401
          curl -fs http://127.0.0.1:8095/ | grep -q "Kit d'urgence"
          docker logs essai 2>&1 | tail -5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication
        run: |
          depot=ghcr.io/${{ github.repository_owner }}/kit-urgence
          for etiquette in latest "${{ steps.v.outputs.version }}" "sha-${{ github.sha }}"; do
            docker tag kit-urgence:essai "$depot:$etiquette"
            docker push "$depot:$etiquette"
          done
